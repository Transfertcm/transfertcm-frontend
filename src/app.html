<!doctype html>
<html lang="fr" class="">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/branding/app_icon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/branding/app_icon.png" />
    <meta name="theme-color" content="#007A5E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TransfertCM — Backoffice Admin" />
    <title>TransfertCM</title>

    <!-- Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!-- Plus Jakarta Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <!-- Anti-FOUC dark mode -->
    <script>
      ;(function () {
        const t = localStorage.getItem('theme')
        if (t === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
